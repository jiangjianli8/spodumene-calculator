<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>锂辉石计价器 · 鑫善源</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --success: #059669;
  --success-dark: #047857;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
  --text: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --border: #e2e8f0;
  --shadow: 0 1px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.08);
  --radius: 12px;
  --radius-sm: 8px;
  --gradient-header: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  --gradient-result: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
  --tier-6-bg: #dbeafe; --tier-6-text: #1d4ed8;
  --tier-5-bg: #d1fae5; --tier-5-text: #059669;
  --tier-4-bg: #fef3c7; --tier-4-text: #d97706;
  --tier-3-bg: #fce7f3; --tier-3-text: #db2777;
  --tier-2-bg: #fde68a; --tier-2-text: #b45309;
  --tier-1-bg: #fecaca; --tier-1-text: #dc2626;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
  padding-bottom: 40px;
}

/* ── Header ── */
.header {
  background: var(--gradient-header);
  color: #fff;
  padding: 20px 16px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
.header .sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
.header .brand { font-size: 11px; color: #64748b; margin-top: 4px; }

/* ── Container ── */
.container { padding: 12px; max-width: 480px; margin: 0 auto; }

/* ── Card ── */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s;
}
.card:active { box-shadow: var(--shadow-lg); }
.card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* ── Price Bar ── */
.price-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f8fafc;
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 12px;
}
.price-bar .label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.price-bar .price { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.5px; }
.price-bar .date { font-size: 11px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
.price-bar .refresh {
  font-size: 18px; cursor: pointer; padding: 4px; border-radius: 50%;
  transition: .2s; display: flex; align-items: center; justify-content: center;
}
.price-bar .refresh:active { background: #e2e8f0; transform: rotate(180deg); }
.price-bar .refresh.loading { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Form ── */
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
.form-row .field { flex: 1; }
.field { margin-bottom: 8px; }
.field label {
  display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 3px;
}
.field .input-wrap { position: relative; }
.field input {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: var(--radius-sm); font-size: 16px; font-weight: 500;
  color: var(--text); outline: none; transition: .15s; background: #fff;
}
.field input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.field .suffix {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: var(--text-muted); pointer-events: none;
}
.note { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* ── Buttons ── */
.btn-group { display: flex; gap: 8px; margin-top: 10px; }
.btn {
  flex: 1; padding: 13px 0; border: none; border-radius: 10px;
  font-size: 16px; font-weight: 700; cursor: pointer; transition: .15s; text-align: center;
}
.btn:active { transform: scale(.97); opacity: .9; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-dark); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:active { background: var(--success-dark); }

/* ── Tier Tag ── */
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.tag-6 { background: var(--tier-6-bg); color: var(--tier-6-text); }
.tag-5 { background: var(--tier-5-bg); color: var(--tier-5-text); }
.tag-4 { background: var(--tier-4-bg); color: var(--tier-4-text); }
.tag-3 { background: var(--tier-3-bg); color: var(--tier-3-text); }
.tag-2 { background: var(--tier-2-bg); color: var(--tier-2-text); }
.tag-1 { background: var(--tier-1-bg); color: var(--tier-1-text); }

/* ── Result Card ── */
.result-card {
  background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow); margin-bottom: 10px; display: none;
}
.result-card.show { display: block; animation: fadeIn .3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.result-header {
  background: var(--gradient-result); color: #fff; padding: 10px 14px;
  font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center;
}
.result-body { padding: 12px 14px; }
.result-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid #f1f5f9; font-size: 13px;
}
.result-row:last-child { border-bottom: none; }
.result-label { color: var(--text-secondary); }
.result-val { font-weight: 700; color: var(--text); }
.result-val.big { font-size: 20px; color: var(--primary); }
.result-val.dun { color: var(--success); }
.result-val.usd { color: #7c3aed; }
.copy-btn {
  background: #f1f5f9; border: none; border-radius: 6px; padding: 4px 10px;
  font-size: 11px; color: #475569; cursor: pointer;
}
.copy-btn:active { background: #e2e8f0; }

/* ── Error Box ── */
.error-box {
  background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-sm);
  padding: 10px 12px; margin-bottom: 10px; font-size: 13px; color: #dc2626; display: none;
}

/* ── History ── */
.history-card {
  background: var(--card-bg); border-radius: var(--radius); padding: 12px 14px;
  box-shadow: var(--shadow); margin-bottom: 10px; display: none;
}
.history-card.show { display: block; animation: fadeIn .3s ease; }
.history-card h3 {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.history-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px;
}
.history-item .h-price { font-weight: 700; color: var(--primary); }
.history-item .h-time { color: var(--text-muted); }
.history-item:last-child { border-bottom: none; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #1e293b; color: #fff; padding: 8px 20px; border-radius: 20px;
  font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 999; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ── Footer ── */
.footer { text-align: center; padding: 16px; font-size: 11px; color: var(--text-muted); }

/* ── Quick Presets ── */
.quick-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.preset-chip {
  padding: 4px 10px; border-radius: 16px; font-size: 11px; font-weight: 600;
  background: #f1f5f9; color: #475569; border: 1.5px solid transparent;
  cursor: pointer; transition: .15s;
}
.preset-chip:active { background: #e2e8f0; }
.preset-chip.active { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

/* ── Responsive ── */
@media (min-width: 480px) {
  .container { padding: 16px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>锂辉石计价器</h1>
  <div class="sub">基于广期所实时行情 · 自动同步</div>
  <div class="brand">佛山市鑫善源商贸有限公司 · 矿链通智助</div>
</div>

<div class="container">
  <!-- 行情卡片 -->
  <div class="card">
    <div class="card-title">📊 主力合约行情</div>
    <div class="price-bar">
      <span class="label" id="priceLabel">最新价</span>
      <span class="price" id="lcPriceDisplay">--</span>
      <span class="date" id="lcPriceDate"></span>
      <span class="refresh" id="refreshBtn" onclick="fetchPrice()" title="刷新行情">↻</span>
    </div>

    <!-- 品位快捷预设 -->
    <div class="quick-presets" id="quickPresets">
      <span class="preset-chip" onclick="setPreset(4.0)">4.0%</span>
      <span class="preset-chip" onclick="setPreset(4.5)">4.5%</span>
      <span class="preset-chip" onclick="setPreset(5.0)">5.0%</span>
      <span class="preset-chip" onclick="setPreset(5.5)">5.5%</span>
      <span class="preset-chip" onclick="setPreset(6.0)">6.0%</span>
    </div>

    <!-- 输入表单 -->
    <div class="form-row">
      <div class="field">
        <label>🔬 Li₂O 品位 <span style="font-weight:400;color:var(--text-muted)">%</span></label>
        <div class="input-wrap">
          <input type="number" id="lio2" placeholder="例 5.0" value="5.0" step="0.1" inputmode="decimal">
          <span class="suffix">%</span>
        </div>
      </div>
      <div class="field">
        <label>♻️ 回收率 <span style="font-weight:400;color:var(--text-muted)">%</span></label>
        <div class="input-wrap">
          <input type="number" id="recovery" placeholder="85" value="85" step="0.1" inputmode="decimal">
          <span class="suffix">%</span>
        </div>
      </div>
    </div>

    <div class="field">
      <label>💰 扣减基准 D <span style="font-weight:400;color:var(--text-muted)">CNY/吨（品位自动匹配）</span></label>
      <div class="input-wrap">
        <input type="number" id="deduction" placeholder="例 23000" inputmode="numeric">
        <span class="suffix">¥</span>
      </div>
      <div class="note" id="deductionTip">输入品位自动匹配 D</div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="calc()">⚡ 计算单价</button>
      <button class="btn btn-success" onclick="copyResult()">📋 复制结果</button>
    </div>
  </div>

  <!-- 错误提示 -->
  <div class="error-box" id="errorMsg"></div>

  <!-- 结果卡片 -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <span>📋 计价结果 <span id="tierTag"></span></span>
      <span class="copy-btn" onclick="copyResult()">📋 复制</span>
    </div>
    <div class="result-body">
      <div class="result-row">
        <span class="result-label">H (30÷74÷回收率÷品位)</span>
        <span class="result-val" id="hDisplay">--</span>
      </div>
      <div class="result-row">
        <span class="result-label">DMT 单价</span>
        <span class="result-val big" id="dmtPrice">-- CNY</span>
      </div>
      <div class="result-row">
        <span class="result-label">吨度价</span>
        <span class="result-val dun" id="dunPrice">-- CNY</span>
      </div>
      <div class="result-row">
        <span class="result-label">折合美元</span>
        <span class="result-val usd" id="usdPrice">-- USD</span>
      </div>
      <div class="result-row">
        <span class="result-label">合约价</span>
        <span class="result-val" id="contractDisplay" style="color:#64748b;font-weight:400">LC2609 = --</span>
      </div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="history-card" id="historyCard">
    <h3><span>📜 计算历史</span><span class="copy-btn" onclick="clearHistory()">清空</span></h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="footer">矿链通智助 v3.3 · 数据来源 鑫善源自有行情服务</div>

<script>
// ═══════════════════════════════════════════
//  锂辉石计价器 v3.3 - H5 升级版
//  基于鑫善源业务逻辑，优化交互体验
// ═══════════════════════════════════════════

const TIERS = [
  { lo: 2, hi: 2.99, d: 26000, label: '2.0%-2.99%', cls: 'tag-1' },
  { lo: 3, hi: 3.49, d: 32000, label: '3.0%-3.49%', cls: 'tag-2' },
  { lo: 3.5, hi: 3.99, d: 28500, label: '3.5%-3.99%', cls: 'tag-3' },
  { lo: 4, hi: 4.49, d: 27000, label: '4.0%-4.49%', cls: 'tag-4' },
  { lo: 4.5, hi: 4.99, d: 24000, label: '4.5%-4.99%', cls: 'tag-5' },
  { lo: 5, hi: 99.99, d: 23000, label: '≥5.0%', cls: 'tag-6' }
];

const STORE_KEY = 'spodumene_params_v3';
const HIST_KEY = 'spodumene_history_v3';
const PRICE_URL = 'data/price.json';

let spodumeneState = {
  contractCode: 'LC2609',
  price: 0,
  date: '',
  lastFetch: 0
};

// ── 工具函数 ──
function fmt(n, d) {
  if (n == null || isNaN(n)) return '--';
  return n.toLocaleString('zh-CN', {
    minimumFractionDigits: d,
    maximumFractionDigits: d
  });
}

function toast(msg, duration = 1500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), duration);
}

function showError(msg) {
  const err = document.getElementById('errorMsg');
  err.textContent = msg;
  err.style.display = 'block';
}

function hideError() {
  document.getElementById('errorMsg').style.display = 'none';
}

// ── 品位档位 ──
function getTier(lio2) {
  for (let i = 0; i < TIERS.length; i++) {
    if (lio2 >= TIERS[i].lo && lio2 <= TIERS[i].hi) return TIERS[i];
  }
  return null;
}

// ── 快捷预设 ──
function setPreset(val) {
  const input = document.getElementById('lio2');
  input.value = val;
  // 高亮选中的 chip
  document.querySelectorAll('.preset-chip').forEach(chip => {
    chip.classList.toggle('active', parseFloat(chip.textContent) === val);
  });
  updateDeductionTip();
}

// ── 扣减基准自动匹配 ──
function updateDeductionTip() {
  const lio2 = parseFloat(document.getElementById('lio2').value);
  const ded = document.getElementById('deduction');
  const tip = document.getElementById('deductionTip');

  if (isNaN(lio2) || lio2 < 2) {
    tip.textContent = '输入品位自动匹配 D';
    return;
  }

  const t = getTier(lio2);
  if (!t) {
    tip.textContent = '品位不在合同范围内';
    return;
  }

  const cv = parseFloat(ded.value);
  if (!ded.value || cv === t.d) {
    ded.value = t.d;
  }
  tip.textContent = '↳ ' + t.label + ' → D = ¥' + fmt(t.d, 0);
}

// ── 持久化 ──
function saveParams() {
  const p = {
    l: document.getElementById('lio2').value,
    r: document.getElementById('recovery').value,
    d: document.getElementById('deduction').value
  };
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
}

function loadParams() {
  try {
    const p = JSON.parse(localStorage.getItem(STORE_KEY));
    if (p) {
      if (p.l) document.getElementById('lio2').value = p.l;
      if (p.r) document.getElementById('recovery').value = p.r;
      if (p.d) document.getElementById('deduction').value = p.d;
    }
  } catch (e) {}
}

// ── 行情获取 ──
function fetchPrice() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');

  fetch(PRICE_URL + '?_=' + Date.now())
    .then(r => r.json())
    .then(d => {
      if (d.price) {
        spodumeneState.price = d.price;
        spodumeneState.date = d.date;
        document.getElementById('lcPriceDisplay').textContent = '¥' + fmt(d.price, 0);
        document.getElementById('lcPriceDate').textContent = d.date + ' ' + (d.updated_at ? d.updated_at.slice(11, 16) : '');
        btn.classList.remove('loading');
      }
    })
    .catch(() => {
      btn.classList.remove('loading');
      toast('行情获取失败，请稍后重试', 2000);
    });
}

// ── 核心计算 ──
function calc() {
  const lio2 = parseFloat(document.getElementById('lio2').value);
  const rec = parseFloat(document.getElementById('recovery').value);
  const d = parseFloat(document.getElementById('deduction').value);
  const lc = spodumeneState.price;

  hideError();
  document.getElementById('resultCard').classList.remove('show');

  // 校验
  if (!lc) { showError('⚠️ 合约价未获取，请点击 ↻ 刷新行情'); return; }
  if (isNaN(lio2) || isNaN(rec) || isNaN(d)) { showError('⚠️ 请完整填写所有参数'); return; }
  if (lio2 < 2) { showError('⚠️ Li₂O 低于 2.0%，买方有权拒收'); return; }
  if (rec <= 0 || rec > 100) { showError('⚠️ 回收率应在 0-100% 之间'); return; }

  // 档位标签
  const tier = getTier(lio2);
  const tag = document.getElementById('tierTag');
  tag.innerHTML = tier ? '<span class="tag ' + tier.cls + '">' + lio2.toFixed(1) + '%</span>' : '';

  // 核心公式
  const recD = rec / 100;
  const lio2D = lio2 / 100;
  const h = 30 / 74 / recD / lio2D;
  const base = lc - d;
  const dmtPrice = base / h;
  const dunPrice = dmtPrice / lio2;
  const usdPrice = dmtPrice / 7.20;

  // 展示结果
  document.getElementById('hDisplay').textContent = h.toFixed(4);
  document.getElementById('dmtPrice').textContent = '¥' + fmt(dmtPrice, 2);
  document.getElementById('dunPrice').textContent = '¥' + fmt(dunPrice, 2);
  document.getElementById('usdPrice').textContent = '$' + fmt(usdPrice, 2);
  document.getElementById('contractDisplay').textContent = spodumeneState.contractCode + ' = ¥' + fmt(lc, 0);

  document.getElementById('resultCard').classList.add('show');
  saveParams();
  addHistory(lc, lio2, rec, d, dmtPrice);

  // 滚动到结果
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── 复制结果 ──
function copyResult() {
  const dmt = document.getElementById('dmtPrice').textContent;
  const dun = document.getElementById('dunPrice').textContent;
  const usd = document.getElementById('usdPrice').textContent;
  const contract = document.getElementById('contractDisplay').textContent;

  const text = [
    '⚡ 锂辉石计价结果',
    '━━━━━━━━━━━━━━',
    'DMT 单价: ' + dmt,
    '吨度价: ' + dun,
    '折合美元: ' + usd,
    '━━━━━━━━━━━━━━',
    contract
  ].join('\n');

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => toast('✅ 已复制到剪贴板'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ 已复制到剪贴板');
  }
}

// ── 历史记录 ──
function addHistory(lc, lio2, rec, d, dmtPrice) {
  try {
    const hist = JSON.parse(localStorage.getItem(HIST_KEY)) || [];
    const now = new Date();
    const entry = {
      t: now.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
      lc, dmt: Math.round(dmtPrice),
      lio2: lio2.toFixed(1), rec: rec.toFixed(1), d: d.toFixed(0)
    };
    hist.unshift(entry);
    if (hist.length > 20) hist.pop();
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
    renderHistory();
  } catch (e) {}
}

function renderHistory() {
  try {
    const hist = JSON.parse(localStorage.getItem(HIST_KEY)) || [];
    const el = document.getElementById('historyList');
    const card = document.getElementById('historyCard');
    if (hist.length === 0) { card.classList.remove('show'); return; }
    card.classList.add('show');
    el.innerHTML = hist.map(h =>
      '<div class="history-item">' +
        '<span>¥' + h.dmt + ' / ' + h.lio2 + '% / D' + h.d + '</span>' +
        '<span class="h-price">LC' + fmt(parseInt(h.lc), 0) + '</span>' +
        '<span class="h-time">' + h.t + '</span>' +
      '</div>'
    ).join('');
  } catch (e) {}
}

function clearHistory() {
  localStorage.removeItem(HIST_KEY);
  renderHistory();
  toast('🗑️ 历史已清空');
}

// ── 事件绑定 ──
document.getElementById('lio2').addEventListener('input', updateDeductionTip);
['lio2', 'recovery', 'deduction'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', function(e) {
    if (e.key === 'Enter') calc();
  });
});

// ── 初始化 ──
window.addEventListener('load', function() {
  loadParams();
  updateDeductionTip();
  fetchPrice();
  renderHistory();
  // 每 30 秒自动刷新行情
  setInterval(fetchPrice, 30000);
});
</script>
</body>
</html>
