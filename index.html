<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>锂辉石计价器 · 鑫善源 ⚡</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>

/* ===== 全局变量 - 锂辉石计价器霓虹主题 ===== */
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a25;
  --bg-card-hover: #1f1f2e;
  --border-glow: #9b00ff80;
  --neon-purple: #9b00ff;
  --neon-blue: #002dff;
  --neon-cyan: #00f0ff;
  --neon-green: #00ff88;
  --neon-pink: #ff0080;
  --neon-gold: #ffd700;
  --text-primary: #ffffff;
  --text-secondary: #a0a0c0;
  --text-muted: #606080;
  --success: #00ff88;
  --danger: #ff4466;
  --warning: #ffaa00;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg-primary);
  min-height: 100vh;
  color: var(--text-primary);
  padding-bottom: 40px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(155, 0, 255, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0, 45, 255, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
  animation: bgFloat 20s ease-in-out infinite;
}

@keyframes bgFloat {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -2%) rotate(1deg); }
  66% { transform: translate(-2%, 2%) rotate(-1deg); }
}

.header {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.12) 0%, rgba(0, 45, 255, 0.12) 100%);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(155, 0, 255, 0.25);
  color: #fff;
  padding: 20px 16px 16px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 30px rgba(155, 0, 255, 0.15);
}

.header h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-cyan), var(--neon-blue));
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.header .sub {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.header .brand {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.source-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  vertical-align: middle;
}

.source-dot.live {
  background: var(--neon-green);
  box-shadow: 0 0 10px var(--neon-green), 0 0 20px var(--neon-green);
  animation: pulse 2s ease-in-out infinite;
}

.source-dot.delayed {
  background: var(--warning);
  box-shadow: 0 0 8px var(--warning);
}

.source-dot.offline {
  background: var(--text-muted);
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.2); }
}

.container {
  padding: 16px 12px;
  max-width: 500px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.card {
  background: var(--bg-card);
  border: 1px solid rgba(155, 0, 255, 0.15);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(155, 0, 255, 0.08), transparent);
  transition: left 0.6s ease;
}

.card:hover::before { left: 100%; }

.card:hover {
  border-color: rgba(155, 0, 255, 0.4);
  box-shadow: 0 0 20px rgba(155, 0, 255, 0.15), 0 8px 32px rgba(0, 0, 0, 0.4);
  transform: translateY(-2px);
}

.card-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.card-title::before {
  content: '';
  width: 3px;
  height: 16px;
  background: linear-gradient(180deg, var(--neon-purple), var(--neon-cyan));
  border-radius: 2px;
}

.price-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.08) 0%, rgba(0, 45, 255, 0.08) 100%);
  border: 1px solid rgba(155, 0, 255, 0.2);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}

.price-bar::after {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 150px;
  height: 150px;
  background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, transparent 70%);
  border-radius: 50%;
  animation: priceGlow 4s ease-in-out infinite;
}

@keyframes priceGlow {
  0%, 100% { transform: scale(1); opacity: 0.5; }
  50% { transform: scale(1.1); opacity: 0.8; }
}

.price-bar .price {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  position: relative;
  z-index: 1;
}

.price-bar .change {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 6px;
  position: relative;
  z-index: 1;
}

.price-bar .change.up {
  color: var(--danger);
  background: rgba(255, 68, 102, 0.12);
  border: 1px solid rgba(255, 68, 102, 0.25);
}

.price-bar .change.down {
  color: var(--success);
  background: rgba(0, 255, 136, 0.12);
  border: 1px solid rgba(0, 255, 136, 0.25);
}

.price-bar .status {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  font-weight: 700;
  position: relative;
  z-index: 1;
}

.price-bar .status.realtime {
  background: rgba(0, 240, 255, 0.12);
  color: var(--neon-cyan);
  border: 1px solid rgba(0, 240, 255, 0.25);
}

.price-bar .status.closed {
  background: rgba(96, 96, 128, 0.15);
  color: var(--text-muted);
  border: 1px solid rgba(96, 96, 128, 0.25);
}

.price-bar .refresh {
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 8px;
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  border: none;
  transition: all 0.3s ease;
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 36px;
  min-height: 36px;
}

.price-bar .refresh:hover {
  box-shadow: 0 0 20px rgba(155, 0, 255, 0.4);
  transform: scale(1.05);
}

.price-bar .refresh:active { transform: scale(0.95); }

.price-bar .refresh.loading { animation: spin 1s linear infinite; }

@keyframes spin { to { transform: rotate(360deg); } }

.quick-presets {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.preset-chip {
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(96, 96, 128, 0.15);
  color: var(--text-secondary);
  border: 1.5px solid rgba(96, 96, 128, 0.25);
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.preset-chip:hover {
  background: rgba(155, 0, 255, 0.12);
  border-color: rgba(155, 0, 255, 0.35);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.preset-chip.active {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.25), rgba(0, 45, 255, 0.25));
  border-color: var(--neon-purple);
  color: var(--text-primary);
  box-shadow: 0 0 15px rgba(155, 0, 255, 0.25);
}

.form-row { display: flex; gap: 10px; margin-bottom: 10px; }
.form-row .field { flex: 1; }
.field { margin-bottom: 10px; }

.field label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}

.field label span {
  font-weight: 400;
  color: var(--text-muted);
  font-size: 11px;
}

.field .input-wrap { position: relative; }

.field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-secondary);
  border: 1.5px solid rgba(96, 96, 128, 0.25);
  border-radius: var(--radius-md);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  outline: none;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.field input:hover { border-color: rgba(155, 0, 255, 0.35); }

.field input:focus {
  border-color: var(--neon-purple);
  box-shadow: 0 0 0 3px rgba(155, 0, 255, 0.12), 0 0 20px rgba(155, 0, 255, 0.15);
  background: var(--bg-card);
}

.field .suffix {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 600;
  pointer-events: none;
}

.note {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  padding-left: 4px;
}

.btn-group {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn {
  flex: 1;
  padding: 14px 0;
  border: none;
  border-radius: 50px;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  text-align: center;
  position: relative;
  overflow: hidden;
  letter-spacing: 1px;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  border: 2px solid var(--neon-purple);
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  display: block;
  border-radius: 50px;
  background: rgba(255, 255, 255, 0.12);
  width: 50px;
  height: 50px;
  transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.btn-primary:hover::before {
  width: 100%;
  background: rgba(255, 255, 255, 0.08);
}

.btn-primary:hover {
  box-shadow: 0 0 30px rgba(155, 0, 255, 0.4), 0 0 60px rgba(0, 45, 255, 0.25);
  transform: translateY(-2px);
}

.btn-primary:active { transform: scale(0.97); }

.btn-success {
  background: transparent;
  color: var(--neon-cyan);
  border: 2px solid var(--neon-cyan);
}

.btn-success::before {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  display: block;
  border-radius: 50px;
  background: rgba(0, 240, 255, 0.08);
  width: 50px;
  height: 50px;
  transition: all 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
}

.btn-success:hover::before {
  width: 100%;
  background: rgba(0, 240, 255, 0.12);
}

.btn-success:hover {
  box-shadow: 0 0 30px rgba(0, 240, 255, 0.35), inset 0 0 20px rgba(0, 240, 255, 0.08);
  transform: translateY(-2px);
}

.btn-success:active { transform: scale(0.97); }

.tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.tag-6 { background: rgba(0, 240, 255, 0.12); color: var(--neon-cyan); border: 1px solid rgba(0, 240, 255, 0.25); }
.tag-5 { background: rgba(0, 255, 136, 0.12); color: var(--neon-green); border: 1px solid rgba(0, 255, 136, 0.25); }
.tag-4 { background: rgba(255, 170, 0, 0.12); color: var(--warning); border: 1px solid rgba(255, 170, 0, 0.25); }
.tag-3 { background: rgba(255, 0, 128, 0.12); color: #ff0080; border: 1px solid rgba(255, 0, 128, 0.25); }
.tag-2 { background: rgba(255, 215, 0, 0.12); color: #ffd700; border: 1px solid rgba(255, 215, 0, 0.25); }
.tag-1 { background: rgba(255, 68, 102, 0.12); color: var(--danger); border: 1px solid rgba(255, 68, 102, 0.25); }

.result-card {
  background: var(--bg-card);
  border: 1px solid rgba(0, 240, 255, 0.15);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 14px;
  display: none;
  position: relative;
}

.result-card.show {
  display: block;
  animation: fadeInUp 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-header {
  background: linear-gradient(135deg, rgba(155, 0, 255, 0.15) 0%, rgba(0, 45, 255, 0.15) 100%);
  color: var(--text-primary);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(155, 0, 255, 0.15);
  letter-spacing: 1px;
}

.result-body { padding: 12px 16px; }

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid rgba(96, 96, 128, 0.12);
  font-size: 13px;
}

.result-row:last-child { border-bottom: none; }

.result-label { color: var(--text-secondary); font-weight: 500; }
.result-val { font-weight: 800; color: var(--text-primary); }

.result-val.big {
  font-size: 22px;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.result-val.dun {
  color: var(--neon-green);
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
}

.result-val.usd {
  color: #ffd700;
  text-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
}

.copy-btn {
  background: rgba(96, 96, 128, 0.15);
  border: 1px solid rgba(96, 96, 128, 0.25);
  border-radius: 8px;
  padding: 5px 12px;
  font-size: 11px;
  color: var(--text-secondary);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s ease;
}

.copy-btn:hover {
  background: rgba(155, 0, 255, 0.15);
  border-color: var(--neon-purple);
  color: var(--text-primary);
}

.copy-btn:active { transform: scale(0.95); }

.error-box {
  background: rgba(255, 68, 102, 0.08);
  border: 1px solid rgba(255, 68, 102, 0.25);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--danger);
  display: none;
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.history-card {
  background: var(--bg-card);
  border: 1px solid rgba(96, 96, 128, 0.15);
  border-radius: var(--radius-lg);
  padding: 14px 16px;
  margin-bottom: 14px;
  display: none;
}

.history-card.show {
  display: block;
  animation: fadeInUp 0.5s ease;
}

.history-card h3 {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(96, 96, 128, 0.12);
  font-size: 12px;
}

.history-item .h-price { font-weight: 800; color: var(--neon-cyan); }
.history-item .h-time { color: var(--text-muted); font-size: 11px; }
.history-item:last-child { border-bottom: none; }

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-blue));
  color: #fff;
  padding: 10px 24px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  z-index: 999;
  pointer-events: none;
  box-shadow: 0 4px 20px rgba(155, 0, 255, 0.35);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.footer {
  text-align: center;
  padding: 16px;
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 1px;
}

@media (min-width: 480px) {
  .container { padding: 20px 16px; }
}

</style>
</head>
<body>

<div class="header">
  <h1>⚡ 锂辉石计价器</h1>
  <div class="sub"><span class="source-dot offline" id="sourceDot"></span> 广期所实时行情 · <span id="sourceLabel">连接中...</span></div>
  <div class="brand">佛山市鑫善源商贸有限公司 · 矿链通智助</div>
</div>

<div class="container">
  <div class="card">
    <div class="card-title">📊 主力合约行情 <span id="lcPriceDate" style="font-weight:400;font-size:11px;color:var(--text-muted)"></span></div>
    <div class="price-bar">
      <span class="price" id="lcPriceDisplay">--</span>
      <span class="change" id="lcChangeDisplay"></span>
      <span class="status" id="lcStatusDisplay"></span>
      <span class="refresh" id="refreshBtn" onclick="fetchPrice()" title="刷新行情">↻</span>
    </div>
    <div class="quick-presets">
      <span class="preset-chip" onclick="setPreset(3.0)">3.0%</span>
      <span class="preset-chip" onclick="setPreset(3.5)">3.5%</span>
      <span class="preset-chip" onclick="setPreset(4.0)">4.0%</span>
      <span class="preset-chip" onclick="setPreset(4.5)">4.5%</span>
      <span class="preset-chip" onclick="setPreset(5.0)">5.0%</span>
      <span class="preset-chip" onclick="setPreset(5.5)">5.5%</span>
    </div>
    <div class="form-row">
      <div class="field">
        <label>🔬 Li₂O 品位 <span style="font-weight:400;color:var(--text-muted)">%</span></label>
        <div class="input-wrap"><input type="number" id="lio2" placeholder="例 5.0" value="5.0" step="0.1" inputmode="decimal"><span class="suffix">%</span></div>
      </div>
      <div class="field">
        <label>♻️ 回收率 <span style="font-weight:400;color:var(--text-muted)">%</span></label>
        <div class="input-wrap"><input type="number" id="recovery" placeholder="85" value="85" step="0.1" inputmode="decimal"><span class="suffix">%</span></div>
      </div>
    </div>
    <div class="field">
      <label>💰 扣减基准 D <span style="font-weight:400;color:var(--text-muted)">CNY/吨（品位自动匹配）</span></label>
      <div class="input-wrap"><input type="number" id="deduction" placeholder="例 23000" inputmode="numeric"><span class="suffix">¥</span></div>
      <div class="note" id="deductionTip">输入品位自动匹配 D</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="calc()">⚡ 计算单价</button>
      <button class="btn btn-success" onclick="copyResult()">📋 复制结果</button>
    </div>
  </div>

  <div class="error-box" id="errorMsg"></div>

  <div class="result-card" id="resultCard">
    <div class="result-header"><span>📋 计价结果 <span id="tierTag"></span></span><span class="copy-btn" onclick="copyResult()">📋 复制</span></div>
    <div class="result-body">
      <div class="result-row"><span class="result-label">H (30÷74÷回收率÷品位)</span><span class="result-val" id="hDisplay">--</span></div>
      <div class="result-row"><span class="result-label">DMT 单价</span><span class="result-val big" id="dmtPrice">-- CNY</span></div>
      <div class="result-row"><span class="result-label">吨度价</span><span class="result-val dun" id="dunPrice">-- CNY</span></div>
      <div class="result-row"><span class="result-label">折合美元</span><span class="result-val usd" id="usdPrice">-- USD</span></div>
      <div class="result-row"><span class="result-label">合约价</span><span class="result-val" id="contractDisplay" style="color:#64748b;font-weight:400">LC0 = --</span></div>
    </div>
  </div>

  <div class="history-card" id="historyCard">
    <h3><span>📜 计算历史</span><span class="copy-btn" onclick="clearHistory()">清空</span></h3>
    <div id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="footer">矿链通锂辉石计价器 v7.0 · UI升级 by Uiverse Galaxy · 佛山鑫善源</div>

<script>
const TIERS = [
  { lo: 2, hi: 2.99, d: 26000, label: '2.0%-2.99%', cls: 'tag-1' },
  { lo: 3, hi: 3.49, d: 32000, label: '3.0%-3.49%', cls: 'tag-2' },
  { lo: 3.5, hi: 3.99, d: 28500, label: '3.5%-3.99%', cls: 'tag-3' },
  { lo: 4, hi: 4.49, d: 27000, label: '4.0%-4.49%', cls: 'tag-4' },
  { lo: 4.5, hi: 4.99, d: 24000, label: '4.5%-4.99%', cls: 'tag-5' },
  { lo: 5, hi: 99.99, d: 23000, label: '≥5.0%', cls: 'tag-6' }
];

const STORE_KEY = 'spodumene_params_v3';
const HIST_KEY = 'spodumene_history_v3';

// Cloudflare Worker 实时行情代理
const PROXY = 'https://lc.fsxsymall.com/lc';
const FALLBACK = 'https://raw.githubusercontent.com/jiangjianli8/spodumene-calculator/master/data/price.json';
const POLL_LIVE = 3000;
const POLL_SLOW = 300000;

let state = { price: 0, date: '', ts: 0, mode: 'init' };

function fmt(n, d) {
  if (n == null || isNaN(n)) return '--';
  return n.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function toast(m, t) {
  t = t || 1500;
  var el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.classList.remove('show'); }, t);
}

function showError(m) { var e = document.getElementById('errorMsg'); e.textContent = m; e.style.display = 'block'; }
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }

function getTier(v) {
  for (var i = 0; i < TIERS.length; i++) { if (v >= TIERS[i].lo && v <= TIERS[i].hi) return TIERS[i]; }
  return null;
}

function setPreset(v) {
  document.getElementById('lio2').value = v;
  document.querySelectorAll('.preset-chip').forEach(function(c) { c.classList.toggle('active', parseFloat(c.textContent) === v); });
  updateDeductionTip();
}

function updateDeductionTip() {
  var v = parseFloat(document.getElementById('lio2').value);
  var t = document.getElementById('deductionTip');
  if (isNaN(v) || v < 2) { t.textContent = '输入品位自动匹配 D'; return; }
  var r = getTier(v);
  if (!r) { t.textContent = '品位不在合同范围内'; return; }
  var d = document.getElementById('deduction');
  if (!d.value || parseFloat(d.value) === r.d) d.value = r.d;
  t.textContent = '已根据品位自动匹配 D';
}

function saveParams() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ l: document.getElementById('lio2').value, r: document.getElementById('recovery').value, d: document.getElementById('deduction').value })); } catch(e) {}
}

function loadParams() {
  try { var p = JSON.parse(localStorage.getItem(STORE_KEY)); if (p) { if(p.l) document.getElementById('lio2').value = p.l; if(p.r) document.getElementById('recovery').value = p.r; if(p.d) document.getElementById('deduction').value = p.d; } } catch(e) {}
}

function setMode(m) {
  state.mode = m;
  document.getElementById('sourceDot').className = 'source-dot ' + (m === 'realtime' ? 'live' : m === 'fallback' ? 'delayed' : 'offline');
  document.getElementById('sourceLabel').textContent = { realtime: '实时 3秒刷新', fallback: '延时 ~5分钟', offline: '离线', init: '连接中...' }[m] || '连接中...';
}

function updateUI(d) {
  state.price = d.price; state.date = d.date; state.ts = Date.now();
  document.getElementById('lcPriceDisplay').textContent = '¥' + fmt(d.price, 0);
  var c = d.change || (d.price - d.pre_close);
  var cp = d.change_pct || (d.pre_close ? (c / d.pre_close * 100) : 0);
  if (d.pre_close) {
    var el = document.getElementById('lcChangeDisplay');
    el.textContent = (c >= 0 ? '+' : '') + fmt(c, 0) + ' (' + (cp >= 0 ? '+' : '') + cp.toFixed(2) + '%)';
    el.className = 'change ' + (c >= 0 ? 'up' : 'down');
  }
  var s = document.getElementById('lcStatusDisplay');
  if (d.status === '盘中实时') { s.textContent = '实时'; s.className = 'status realtime'; }
  else { s.textContent = '收盘'; s.className = 'status closed'; }
  var dt = document.getElementById('lcPriceDate');
  var t = d.date ? '→ ' + d.date : '';
  if (d.time) t += ' ' + d.time.slice(0, 5);
  dt.textContent = t;
}

function fetchLive() {
  var prev = state.mode;
  fetch(PROXY + '?_=' + Date.now())
    .then(function(r) { if(!r.ok) throw Error('x'); return r.json(); })
    .then(function(d) { if(!d.price) throw Error('x'); updateUI(d); setMode('realtime'); if(prev === 'fallback') toast('⚡ 已切换到实时行情'); })
    .catch(function() { setMode('fallback'); fetchFallback(); });
}

function fetchFallback() {
  return fetch(FALLBACK + '?_=' + Date.now())
    .then(function(r) { if(!r.ok) throw Error('x'); return r.json(); })
    .catch(function() { return fetch('data/price.json?_=' + Date.now()).then(function(r) { return r.json(); }); })
    .then(function(d) {
      if(!d.price) throw Error('x');
      updateUI({ symbol: d.symbol||'LC0', price: d.price, open: d.open||0, high: d.high||0, low: d.low||0, pre_close: d.pre_close||0, volume: d.volume||0, position: d.hold||d.position||0, change: d.change||0, change_pct: d.change_pct||0, date: d.date||'', time: d.tick_time||'', status: d.status||'收盘' });
      setMode('fallback');
    })
    .catch(function() { setMode('offline'); });
}

function fetchPrice() {
  var b = document.getElementById('refreshBtn'); b.classList.add('loading');
  fetch(PROXY + '?_=' + Date.now())
    .then(function(r) { if(!r.ok) throw Error('x'); return r.json(); })
    .then(function(d) {
      if(!d.price) throw Error('x');
      updateUI(d); setMode('realtime');
      var dt = document.getElementById('lcPriceDate');
      dt.textContent = '→ ' + (d.date||'') + ' ' + (d.time||'').slice(0,5) + ' ✓';
      clearTimeout(dt._t); dt._t = setTimeout(function() { dt.textContent = '→ ' + (d.date||'') + ' ' + (d.time||'').slice(0,5); }, 3000);
    })
    .catch(function() {
      fetchFallback().then(function() {
        var dt = document.getElementById('lcPriceDate'); dt.textContent += ' ✓';
        setTimeout(function() { dt.textContent = dt.textContent.replace(' ✓',''); }, 3000);
      });
    })
    .finally(function() { b.classList.remove('loading'); });
}

function calc() {
  var lio2 = parseFloat(document.getElementById('lio2').value);
  var rec = parseFloat(document.getElementById('recovery').value);
  var d = parseFloat(document.getElementById('deduction').value);
  var lc = state.price;
  hideError();
  document.getElementById('resultCard').classList.remove('show');
  if(!lc) { showError('⚠️ 合约价未获取，请点击 ↻ 刷新行情'); return; }
  if(isNaN(lio2)||isNaN(rec)||isNaN(d)) { showError('⚠️ 请完整填写所有参数'); return; }
  if(lio2 < 2) { showError('⚠️ Li₂O 低于 2.0%，买方有权拒收'); return; }
  if(rec <= 0 || rec > 100) { showError('⚠️ 回收率应在 0-100% 之间'); return; }
  var tier = getTier(lio2);
  document.getElementById('tierTag').innerHTML = tier ? '<span class="tag '+tier.cls+'">'+lio2.toFixed(1)+'%</span>' : '';
  var h = 30 / 74 / (rec/100) / (lio2/100);
  var dmt = (lc - d) / h;
  document.getElementById('hDisplay').textContent = h.toFixed(4);
  document.getElementById('dmtPrice').textContent = '¥'+fmt(dmt,2);
  document.getElementById('dunPrice').textContent = '¥'+fmt(dmt/lio2,2);
  document.getElementById('usdPrice').textContent = '$'+fmt(dmt/7.20,2);
  document.getElementById('contractDisplay').textContent = 'LC0 = ¥'+fmt(lc,0);
  document.getElementById('resultCard').classList.add('show');
  saveParams();
  addHistory(lc, lio2, rec, d, dmt);
  document.getElementById('resultCard').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function copyResult() {
  var t = '⚡ 锂辉石计价结果\n━━━━━━━━━━━━━━\nDMT 单价: '+document.getElementById('dmtPrice').textContent+'\n吨度价: '+document.getElementById('dunPrice').textContent+'\n折合美元: '+document.getElementById('usdPrice').textContent+'\n━━━━━━━━━━━━━━\n'+document.getElementById('contractDisplay').textContent;
  if(navigator.clipboard) { navigator.clipboard.writeText(t).then(function(){toast('✅ 已复制')}); }
  else { var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); toast('✅ 已复制'); }
}

function addHistory(lc,lio2,rec,d,dmt) {
  try {
    var h=JSON.parse(localStorage.getItem(HIST_KEY))||[];
    h.unshift({t:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),lc:lc,dmt:Math.round(dmt),lio2:lio2.toFixed(1),rec:rec.toFixed(1),d:d.toFixed(0)});
    if(h.length>20) h.pop();
    localStorage.setItem(HIST_KEY,JSON.stringify(h));
    renderHistory();
  }catch(e){}
}

function renderHistory() {
  try {
    var h=JSON.parse(localStorage.getItem(HIST_KEY))||[];
    var el=document.getElementById('historyList'), card=document.getElementById('historyCard');
    if(!h.length){card.classList.remove('show');return;}
    card.classList.add('show');
    el.innerHTML=h.map(function(r){return '<div class="history-item"><span>¥'+r.dmt+' / '+r.lio2+'% / D'+r.d+'</span><span class="h-price">LC'+fmt(parseInt(r.lc),0)+'</span><span class="h-time">'+r.t+'</span></div>'}).join('');
  }catch(e){}
}

function clearHistory() { localStorage.removeItem(HIST_KEY); renderHistory(); toast('🗑️ 已清空'); }

document.getElementById('lio2').addEventListener('input', updateDeductionTip);
['lio2','recovery','deduction'].forEach(function(id) { document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter')calc()}); });

window.addEventListener('load', function() {
  loadParams(); updateDeductionTip(); setMode('init'); fetchLive(); renderHistory();
  var poll = function() {
    fetchLive();
    clearTimeout(poll._t);
    poll._t = setTimeout(poll, state.mode === 'realtime' ? POLL_LIVE : POLL_SLOW);
  };
  setTimeout(function() { poll._t = setTimeout(poll, state.mode === 'realtime' ? POLL_LIVE : POLL_SLOW); }, POLL_LIVE);
});
</script>
</body>
</html>
