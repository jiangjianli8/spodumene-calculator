name: 更新碳酸锂期货行情

on:
  schedule:
    - cron: '*/5 1-7 * * 1-5'
    - cron: '35,50 7 * * 1-5'
  workflow_dispatch:

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install akshare

      - name: 获取行情并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          python update_price.py
          
          git add data/price.json
          if git diff --cached --quiet; then
            echo "行情无变化，跳过推送"
          else
            git commit -m "auto: 更新碳酸锂期货行情 $(date -u +%Y-%m-%d_%H:%M)"
            git push
          fi

      - name: 失败告警（自动开 Issue）
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 行情更新失败 ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `工作流 **${context.workflow}** 运行失败。`,
              ``,
              `- 运行记录：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- 触发时间：${new Date().toISOString()}`,
              ``,
              `**排查提示**：优先检查 akshare 接口是否再次改名（历史案例：futures_zh_realtime → futures_zh_realtime_sina，2026-11-13 起静默失败 6 天）。`
            ].join(String.fromCharCode(10));
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
