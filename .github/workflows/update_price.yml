name: 更新碳酸锂期货行情

on:
  # 每个交易日北京时间9:00启动（UTC 1:00）
  schedule:
    - cron: '0 1 * * 1-5'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install akshare

      - name: 循环更新行情（每5分钟，覆盖交易时段及收盘后）
        run: |
          echo "开始循环更新行情（每5分钟刷新，收盘后价格不变自动跳过）..."
          while true; do
            NOW=$(date -u +%H:%M)
            echo "当前UTC时间: $NOW"
            
            # 获取行情
            python update_price.py || echo "本次更新失败，继续下一轮"
            
            # 提交推送
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/price.json
            if git diff --cached --quiet; then
              echo "行情无变化，跳过推送"
            else
              git commit -m "auto: 更新碳酸锂期货行情 $(date -u +%Y-%m-%d_%H:%M)"
              git push
              echo "行情已推送到GitHub"
            fi
            
            # 等待5分钟
            echo "等待5分钟后再次更新..."
            sleep 300
          done
