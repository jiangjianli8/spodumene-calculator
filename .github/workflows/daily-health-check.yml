name: 六计算器每日巡检

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 巡检六个计算器
        id: check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 必须开 pipefail：默认管道的退出码取 tee 的 0，
        # 脚本的 exit 1 会被吞掉，导致巡检永远绿、从不开 Issue。
        run: |
          set -o pipefail
          python -X utf8 scripts/health_check_all.py 2>&1 | tee result.txt

      - name: 发现问题时开 Issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '（无输出）';
            try {
              body = fs.readFileSync('result.txt', 'utf8').slice(0, 60000);
            } catch (e) {}
            const title = `⚠️ 计算器巡检发现问题 ${new Date().toISOString().slice(0,10)}`;
            const lines = [
              `**六仓库健康巡检发现异常，需人工维护。**`,
              ``,
              '```',
              body,
              '```',
              ``,
              `- [运行记录](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              `- 巡检脚本：\`scripts/health_check_all.py\``,
              ``,
              `**常见原因**：akshare 接口改名、数据源异常、Pages 部署失败。历史案例：2026-11-13 futures_zh_realtime 改名导致静默失败 6 天。`
            ];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: lines.join(String.fromCharCode(10))
            });

      - name: 推送飞书告警
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        with:
          script: |
            const fs = require('fs');
            const NL = String.fromCharCode(10);

            if (!process.env.FEISHU_WEBHOOK) {
              core.warning('未配置 FEISHU_WEBHOOK，跳过飞书推送');
            } else {
              let body = '';
              try { body = fs.readFileSync('result.txt', 'utf8'); } catch (e) {}
              const marks = body.split(NL)
                .filter(l => l.indexOf('✗') >= 0)
                .map(l => l.trim().slice(0, 200));
              const list = marks.length
                ? marks.join(NL)
                : '（脚本未输出明细，请查看运行日志）';
              const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo
                           + '/actions/runs/' + context.runId;
              const card = {
                msg_type: 'interactive',
                card: {
                  config: { wide_screen_mode: true },
                  header: {
                    title: { tag: 'plain_text', content: '计算器巡检发现问题' },
                    template: 'red'
                  },
                  elements: [
                    { tag: 'div', text: { tag: 'lark_md',
                      content: '**六计算器每日巡检** ' + new Date().toISOString().slice(0, 10)
                             + NL + '共发现 **' + marks.length + '** 处问题：' } },
                    { tag: 'div', text: { tag: 'lark_md', content: list } },
                    { tag: 'hr' },
                    { tag: 'action', actions: [{
                      tag: 'button',
                      text: { tag: 'plain_text', content: '查看运行日志' },
                      url: runUrl,
                      type: 'danger'
                    }] }
                  ]
                }
              };
              const res = await fetch(process.env.FEISHU_WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(card)
              });
              const txt = await res.text();
              core.info('飞书返回: ' + txt);
              let j = {};
              try { j = JSON.parse(txt); } catch (e) {}
              if (j.code !== 0 && j.StatusCode !== 0) {
                core.setFailed('飞书推送失败: ' + txt);
              }
            }

      - name: 标记本次巡检失败
        if: steps.check.outcome == 'failure'
        run: |
          echo "巡检发现问题，详见上方输出与已创建的 Issue"
          exit 1
